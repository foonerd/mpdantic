<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPDantic</title>
<style>
  :root {
    --bg: #f4f4f1; --panel: #ffffff; --line: #d8d8d2; --text: #1d1d1b; --muted: #6b6b66;
    --accent: #2f7d32; --danger: #b3261e; --warn: #9a6200; --hover: #eef5ee; --code: #efefeb;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1c; --panel: #262626; --line: #404040; --text: #e6e6e6; --muted: #9a9a9a;
      --accent: #54b948; --danger: #d64545; --warn: #e6a23c; --hover: #2e342e; --code: #303030;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4; }
  .header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: baseline; gap: 12px; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .sub { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: .3px; padding: 2px 8px; border-radius: 10px; background: var(--line); color: var(--muted); text-transform: uppercase; }
  .badge.ok { background: var(--accent); color: #fff; }
  .badge.bad { background: var(--danger); color: #fff; }
  .container { max-width: 1000px; margin: 0 auto; padding: 14px 16px 60px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 10px; font-size: 14px; }
  .crumbs a { color: var(--accent); text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs .sep { color: var(--muted); }
  .crumbs .here { font-weight: 600; }
  .list, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.dir { cursor: pointer; }
  .row.dir:hover { background: var(--hover); }
  .row .icon { width: 1.4em; color: var(--muted); text-align: center; flex: none; }
  .row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row.dir .name { color: var(--accent); font-weight: 600; }
  .row.dot .name { color: var(--muted); font-style: italic; }
  .row .size { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; flex: none; }
  .foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  button, select { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 6px; }
  button:hover, select:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  label.pref { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .empty, .error { padding: 18px 12px; color: var(--muted); }
  .error { color: var(--danger); }
  .panel { margin-top: 18px; }
  .panel .head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel .head b { font-size: 15px; }
  .panel .head .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .panel .body { padding: 10px 12px 14px; }
  .progress { color: var(--muted); font-size: 13px; }
  .progress.bad { color: var(--danger); }
  .section { margin-top: 14px; }
  .section h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .section .help { color: var(--muted); font-size: 13px; }
  table.kv { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.kv td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv tr:last-child td { border-bottom: 0; }
  table.kv td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; background: var(--code); padding: 1px 5px; border-radius: 4px; }
  .sugg { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .sugg:last-child { border-bottom: 0; }
  .sugg .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .sugg .why { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .sugg .ex { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 8px; background: var(--line); color: var(--muted); text-transform: uppercase; }
  .tag.warn { background: var(--warn); color: #fff; }
  .tag.bad { background: var(--danger); color: #fff; }
  .tag.ok { background: var(--accent); color: #fff; }
  details.sheet { padding: 8px 0; border-bottom: 1px solid var(--line); }
  details.sheet:last-child { border-bottom: 0; }
  details.sheet summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  details.sheet summary .path { overflow-wrap: anywhere; }
  details.sheet .inner { margin-top: 6px; padding-left: 8px; border-left: 2px solid var(--line); }
  .finding { font-size: 13px; margin: 3px 0; }
  .finding code { margin-right: 4px; }
</style>
</head>
<body>
<div class="header">
  <h1>MPDantic</h1>
  <span class="sub" id="version"></span>
  <span class="grow"></span>
  <span class="badge" id="state">...</span>
</div>
<div class="container">
  <div class="crumbs" id="crumbs"></div>
  <div class="list" id="list"></div>
  <div class="foot"><span id="count"></span><span class="grow"></span><button id="more" hidden>More</button></div>

  <div class="panel" id="panel-ignore">
    <div class="head">
      <b>.mpdignore</b>
      <span class="sub">What MPD's update would meet under this folder, and the lines that would keep the junk out. Read-only.</span>
      <span class="grow"></span>
      <label class="pref" title="Glass plays video from the library; with video in use, video containers are counted and never suggested.">Video here:
        <select id="pref-video">
          <option value="auto">as Glass says</option>
          <option value="in_use">in use</option>
          <option value="junk">not wanted</option>
        </select>
      </label>
      <button id="analyse-ignore">Analyse this folder</button>
      <button id="cancel-ignore" hidden>Cancel</button>
    </div>
    <div class="body">
      <div class="progress" id="progress-ignore">Not analysed yet.</div>
      <div id="report-ignore"></div>
    </div>
  </div>

  <div class="panel" id="panel-cue">
    <div class="head">
      <b>CUE sheets</b>
      <span class="sub">Every sheet under this folder read as MPD reads it, and what MPD makes of it. Read-only.</span>
      <span class="grow"></span>
      <button id="analyse-cue">Check this folder</button>
      <button id="cancel-cue" hidden>Cancel</button>
    </div>
    <div class="body">
      <div class="progress" id="progress-cue">Not checked yet.</div>
      <div id="report-cue"></div>
    </div>
  </div>
</div>
<script>
'use strict';
(function () {
  const $ = (id) => document.getElementById(id);
  // The folder on show: its path in MPD's form, the entries read so far, the count.
  let current = { path: '', entries: [], total: 0, more: false };

  const size = (n) => {
    if (n < 1024) return n + ' B';
    const units = ['KB', 'MB', 'GB', 'TB'];
    let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
    return (n < 10 ? n.toFixed(1) : String(Math.round(n))) + ' ' + units[i];
  };
  const toHash = (path) => '#' + path.split('/').map(encodeURIComponent).join('/');
  const fromHash = () => location.hash.replace(/^#/, '').split('/').map((s) => {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }).join('/');
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const ms = (n) => {
    if (n === null || n === undefined) return '';
    const s = Math.floor(n / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };

  async function api(url, options) {
    const r = await fetch(url, Object.assign({ cache: 'no-store' }, options || {}));
    if (r.status === 204) return null;
    const body = await r.json().catch(() => ({ error: r.statusText }));
    if (!r.ok) throw new Error(body.error || r.statusText);
    return body;
  }

  // ------------------------------------------------------------- the library

  function crumbs(path) {
    const box = $('crumbs');
    box.textContent = '';
    const parts = path ? path.split('/') : [];
    const add = (text, target, here) => {
      if (here) { box.appendChild(el('span', 'here', text)); return; }
      const a = el('a', '', text);
      a.href = toHash(target);
      box.appendChild(a);
    };
    add('Library', '', parts.length === 0);
    parts.forEach((part, i) => {
      box.appendChild(el('span', 'sep', '/'));
      add(part, parts.slice(0, i + 1).join('/'), i === parts.length - 1);
    });
  }

  function render() {
    crumbs(current.path);
    const list = $('list');
    list.textContent = '';
    if (!current.entries.length) list.appendChild(el('div', 'empty', 'Nothing here.'));
    current.entries.forEach((entry) => {
      const row = el('div', 'row' + (entry.dir ? ' dir' : '') + (entry.name.startsWith('.') ? ' dot' : ''));
      row.appendChild(el('span', 'icon', entry.dir ? String.fromCharCode(0x25B8) : String.fromCharCode(0xB7)));
      row.appendChild(el('span', 'name', entry.name));
      row.appendChild(el('span', 'size', entry.dir ? '' : size(entry.size)));
      if (entry.dir) row.addEventListener('click', () => { location.hash = toHash((current.path ? current.path + '/' : '') + entry.name); });
      list.appendChild(row);
    });
    const dirs = current.entries.filter((e) => e.dir).length;
    const shown = current.entries.length;
    $('count').textContent = current.total
      ? (shown < current.total ? shown + ' of ' + current.total + ' shown' : current.total + ' entries') + ', ' + dirs + ' folders'
      : '';
    $('more').hidden = !current.more;
    $('analyse-ignore').textContent = current.path ? 'Analyse this folder' : 'Analyse the whole library';
    $('analyse-cue').textContent = current.path ? 'Check this folder' : 'Check the whole library';
  }

  function failed(path, message) {
    current = { path, entries: [], total: 0, more: false };
    crumbs(path);
    const list = $('list');
    list.textContent = '';
    list.appendChild(el('div', 'error', message));
    $('count').textContent = '';
    $('more').hidden = true;
  }

  // One folder, one page at a time; More reads the next page of the same folder.
  async function load(path, next) {
    const offset = next ? current.entries.length : 0;
    try {
      const listing = await api('/api/list?path=' + encodeURIComponent(path) + '&offset=' + offset);
      if (next && listing.path === current.path) {
        current.entries = current.entries.concat(listing.entries);
        current.total = listing.total;
        current.more = listing.more;
      } else {
        current = { path: listing.path, entries: listing.entries, total: listing.total, more: listing.more };
      }
      render();
    } catch (e) {
      failed(path, String(e.message || e));
    }
  }

  async function status() {
    const badge = $('state');
    try {
      const s = await api('/api/status');
      $('version').textContent = 'core ' + s.version;
      badge.textContent = s.state === 'error' ? 'error' : 'up';
      badge.className = 'badge ' + (s.state === 'error' ? 'bad' : 'ok');
      badge.title = s.error || '';
    } catch (e) {
      badge.textContent = 'unreachable';
      badge.className = 'badge bad';
    }
  }

  // ---------------------------------------------------------- the preferences

  function showPrefs(p) {
    const select = $('pref-video');
    select.value = p.video;
    select.options[0].textContent = p.glass ? 'as Glass says (in use)' : 'as Glass says (not found)';
    select.title = p.error ? 'Not kept: ' + p.error : (p.video_in_use ? 'Video containers are counted, never suggested.' : 'Video containers are suggested as lines to keep out.');
  }

  async function loadPrefs() {
    try { showPrefs(await api('/api/preferences')); } catch (e) { /* the core said nothing */ }
  }

  async function savePrefs() {
    try {
      showPrefs(await api('/api/preferences', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ video: $('pref-video').value }) }));
    } catch (e) {
      $('pref-video').title = String(e.message || e);
    }
  }

  // ---------------------------------------------------------------- the jobs

  const CLASSES = {
    system_folder: 'NAS and system folders', sidecar: 'Sidecar files', archive: 'Archives', video: 'Video containers',
    ffmpeg_only: 'Claimed only by ffmpeg', audio: 'Audio', cue: 'CUE sheets', playlist: 'Playlists', image: 'Images',
    other: 'Other', folder: 'Folders'
  };
  // One job at a time in the core; each panel follows its own kind.
  const panels = {
    ignore: { kind: 'ignore', job: null, verb: 'Walking', render: reportIgnore },
    cue: { kind: 'cue', job: null, verb: 'Reading', render: reportCue }
  };

  function progress(p, text, bad) {
    const node = $('progress-' + p.kind);
    node.textContent = text;
    node.className = 'progress' + (bad ? ' bad' : '');
  }

  function buttons(p, running) {
    $('cancel-' + p.kind).hidden = !running;
    Object.values(panels).forEach((q) => { $('analyse-' + q.kind).disabled = running; });
  }

  async function analyse(p) {
    $('report-' + p.kind).textContent = '';
    try {
      const started = await api('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: p.kind, path: current.path }) });
      follow(p, started.id);
    } catch (e) {
      progress(p, String(e.message || e), true);
    }
  }

  function follow(p, id) {
    if (p.job && p.job.timer) clearTimeout(p.job.timer);
    p.job = { id, timer: null };
    buttons(p, true);
    poll(p);
  }

  async function poll(p) {
    if (!p.job) return;
    try {
      const j = await api('/api/jobs/' + p.job.id);
      if (j.state === 'running') {
        progress(p, p.verb + ' ' + (j.path || 'the library') + ': ' + j.directories + ' folders, ' + j.files + ' files, ' + j.seconds + ' s.');
        p.job.timer = setTimeout(() => poll(p), 1000);
        return;
      }
      ended(p, j);
    } catch (e) {
      progress(p, String(e.message || e), true);
      ended(p, null);
    }
  }

  function ended(p, j) {
    buttons(p, false);
    p.job = null;
    if (!j) return;
    if (j.state === 'failed') { progress(p, 'Failed: ' + j.error, true); return; }
    progress(p, (j.state === 'cancelled' ? 'Cancelled after ' : 'Done in ') + j.seconds + ' s: ' + j.directories + ' folders, ' + j.files + ' files under ' + (j.path || 'the library') + '.');
    p.render(j.result);
  }

  async function cancel(p) {
    if (!p.job) return;
    try { await api('/api/jobs/' + p.job.id, { method: 'DELETE' }); } catch (e) { progress(p, String(e.message || e), true); }
  }

  function section(parent, title, help) {
    const s = el('div', 'section');
    s.appendChild(el('h3', '', title));
    if (help) s.appendChild(el('div', 'help', help));
    parent.appendChild(s);
    return s;
  }

  function table(parent, rows) {
    const t = el('table', 'kv');
    rows.forEach((cells) => {
      const tr = el('tr');
      cells.forEach((c, i) => {
        const td = el('td', i > 0 ? 'num' : '');
        if (c instanceof Node) td.appendChild(c); else td.textContent = c;
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    parent.appendChild(t);
  }

  // ------------------------------------------------------- the .mpdignore report

  function reportIgnore(r) {
    const box = $('report-ignore');
    box.textContent = '';
    if (!r) return;
    const decoders = r.decoders.source === 'mpd'
      ? 'The decoders of the running MPD: ' + r.decoders.count + ' suffixes, ' + r.decoders.detail + '.'
      : 'MPD could not be asked for its decoders (' + r.decoders.detail + '); ' + r.decoders.count + ' audio suffixes assumed.';
    const notes = [decoders];
    if (r.video_in_use) notes.push('Video is in use here: video containers are counted, not suggested.');
    if (r.unreadable) notes.push(r.unreadable + ' entries could not be read.');
    if (r.too_deep) notes.push(r.too_deep + ' folders were nested too deep to walk.');
    if (r.cancelled) notes.push('The walk was cancelled: the counts are partial.');
    const s = section(box, 'Suggested lines', 'Each would go into .mpdignore at ' + (r.path || 'the library root') + ' and cover everything under it. Nothing is written from this page.');
    if (!r.suggestions.length) {
      s.appendChild(el('div', 'help', 'Nothing to keep out: MPD meets only music, playlists, sheets and pictures here.'));
    } else {
      r.suggestions.forEach((g) => {
        const d = el('div', 'sugg');
        const top = el('div', 'top');
        top.appendChild(el('code', '', g.pattern));
        top.appendChild(el('span', 'tag' + (g.class === 'video' ? ' warn' : ''), CLASSES[g.class] || g.class));
        top.appendChild(el('span', '', g.count + (g.count === 1 ? ' entry' : ' entries') + (g.bytes ? ', ' + size(g.bytes) : '')));
        d.appendChild(top);
        d.appendChild(el('div', 'why', g.note));
        if (g.examples.length) d.appendChild(el('div', 'ex', g.examples.join('  |  ')));
        s.appendChild(d);
      });
    }
    const classes = Object.keys(r.classes).map((k) => [CLASSES[k] || k, String(r.classes[k].count), r.classes[k].bytes ? size(r.classes[k].bytes) : '']);
    const c = section(box, 'What MPD meets here', notes.join(' '));
    table(c, classes.length ? classes : [['Nothing', '', '']]);
    if (r.excluded.count) {
      const e = section(box, 'Already kept out', r.excluded.count + ' entries match a line in force, so MPD never looks at them.');
      e.appendChild(el('div', 'ex', r.excluded.examples.join('  |  ')));
    }
    linesInForce(box, r.in_force);
    const audio = Object.keys(r.audio_suffixes).sort((a, b) => r.audio_suffixes[b] - r.audio_suffixes[a]).map((k) => ['.' + k, String(r.audio_suffixes[k])]);
    if (audio.length) table(section(box, 'Audio by suffix'), audio);
    const ffmpeg = Object.keys(r.ffmpeg_suffixes || {}).sort((a, b) => r.ffmpeg_suffixes[b] - r.ffmpeg_suffixes[a]).map((k) => ['.' + k, String(r.ffmpeg_suffixes[k])]);
    if (ffmpeg.length) table(section(box, 'Claimed only by ffmpeg, by suffix', 'MPD opens and probes each of these at every update because its ffmpeg decoder claims the suffix. Text, lyrics and subtitles are suggested above; the rest is counted here.'), ffmpeg);
    if (r.other_suffixes.length) {
      table(section(box, 'Other files by suffix', 'Nothing claims these; MPD stats each one and moves on. A line by hand would spare the stat.'), r.other_suffixes.map((p) => [p[0].startsWith('(') ? p[0] : '.' + p[0], String(p[1])]));
    }
  }

  function linesInForce(box, inForce) {
    const f = section(box, 'Lines in force', inForce.length ? 'The .mpdignore files from the root down to this folder, as MPD inherits them.' : 'No .mpdignore from the root down to this folder.');
    inForce.forEach((l) => {
      const row = el('div', 'sugg');
      row.appendChild(el('div', 'top', (l.dir || 'the root') + '/.mpdignore'));
      const lines = el('div', 'ex');
      l.lines.forEach((line, i) => { if (i) lines.appendChild(document.createTextNode('  |  ')); lines.appendChild(el('code', '', line)); });
      if (!l.lines.length) lines.textContent = 'no pattern in it';
      row.appendChild(lines);
      // A line starting with # is a comment to MPD; one that looks like a name did
      // nothing for its writer.
      l.dead.forEach((line) => {
        const why = el('div', 'why');
        why.appendChild(el('span', 'tag warn', 'dead line'));
        why.appendChild(document.createTextNode(' '));
        why.appendChild(el('code', '', line));
        why.appendChild(document.createTextNode(' is a comment to MPD, so it keeps nothing out. For a name starting with a hash, the line that works is '));
        why.appendChild(el('code', '', '[#]' + line.slice(1)));
        why.appendChild(document.createTextNode('.'));
        row.appendChild(why);
      });
      f.appendChild(row);
    });
  }

  // -------------------------------------------------------------- the CUE report

  const FILE_STATES = { ok: 'beside the sheet', missing: 'not beside the sheet', case: 'there in another case', suffix: 'there with another suffix', not_decoded: 'there, but no decoder claims it', foreign: 'a foreign path' };

  function reportCue(r) {
    const box = $('report-cue');
    box.textContent = '';
    if (!r) return;
    const notes = [];
    if (r.decoders.source !== 'mpd') notes.push('MPD could not be asked for its decoders (' + r.decoders.detail + '); the usual audio suffixes assumed.');
    if (r.unreadable) notes.push(r.unreadable + ' entries could not be read.');
    if (r.cancelled) notes.push('The check was cancelled: the counts are partial.');
    const totals = section(box, 'Sheets under ' + (r.path || 'the library'), notes.join(' '));
    const rows = [['Sheets', String(r.sheets)], ['Clean', String(r.clean)], ['With findings', String(r.with_findings)]];
    Object.keys(r.by_code).forEach((code) => { rows.push([code + '  ' + (r.codes[code] || ''), String(r.by_code[code])]); });
    table(totals, rows);
    if (!r.sheets) { totals.appendChild(el('div', 'help', 'No CUE sheet under this folder.')); linesInForce(box, r.in_force); return; }
    const list = section(box, 'Each sheet', 'Sheets with findings first. A finding says what MPD does with the sheet as it is.' + (r.list_truncated ? ' Only the first ' + r.list.length + ' sheets are listed; the totals count every one.' : ''));
    r.list.forEach((s) => {
      const d = el('details', 'sheet');
      const sum = el('summary');
      sum.appendChild(el('span', 'tag ' + (s.findings.length ? 'bad' : 'ok'), s.findings.length ? s.findings.length + (s.findings.length === 1 ? ' finding' : ' findings') : 'clean'));
      sum.appendChild(el('span', 'path', s.path));
      sum.appendChild(el('span', 'help', s.tracks + (s.tracks === 1 ? ' track' : ' tracks') + (s.album ? ', ' + s.album : '') + (s.encoding && s.encoding !== 'utf-8' ? ', ' + s.encoding : '')));
      d.appendChild(sum);
      const inner = el('div', 'inner');
      s.findings.forEach((f) => {
        const line = el('div', 'finding');
        line.appendChild(el('code', '', f.code + (f.line ? ' line ' + f.line : '')));
        line.appendChild(document.createTextNode(f.text));
        inner.appendChild(line);
      });
      s.files.forEach((f) => {
        const line = el('div', 'finding');
        line.appendChild(el('span', 'tag ' + (f.state === 'ok' ? 'ok' : 'warn'), f.accepted ? f.kind : f.kind + ' (dropped)'));
        line.appendChild(document.createTextNode(' '));
        line.appendChild(el('code', '', f.name));
        line.appendChild(document.createTextNode(' ' + (FILE_STATES[f.state] || f.state) + (f.found ? ': ' + f.found : '')));
        inner.appendChild(line);
      });
      if (s.track_list.length) {
        const rows = s.track_list.map((t) => [t.number + '  ' + (t.title || '') + (t.performer ? '  (' + t.performer + ')' : ''), ms(t.start_ms) + (t.end_ms !== null && t.end_ms !== undefined ? ' to ' + ms(t.end_ms) : ''), t.file]);
        table(inner, rows);
        if (s.tracks_truncated) inner.appendChild(el('div', 'help', 'Only the first ' + s.track_list.length + ' tracks are listed.'));
      }
      d.appendChild(inner);
      list.appendChild(d);
    });
    linesInForce(box, r.in_force);
  }

  // The job already there when the page opens, from this device or another: followed
  // while it runs, shown when it is done, on the panel of its kind.
  async function resume() {
    try {
      const j = await api('/api/jobs');
      const p = panels[j.kind] || panels.ignore;
      if (j.state === 'running') follow(p, j.id); else ended(p, j);
    } catch (e) { /* no job yet */ }
  }

  $('more').addEventListener('click', () => load(current.path, true));
  Object.values(panels).forEach((p) => {
    $('analyse-' + p.kind).addEventListener('click', () => analyse(p));
    $('cancel-' + p.kind).addEventListener('click', () => cancel(p));
  });
  $('pref-video').addEventListener('change', savePrefs);
  window.addEventListener('hashchange', () => load(fromHash(), false));
  load(fromHash(), false);
  loadPrefs();
  resume();
  status();
  setInterval(status, 5000);
})();
</script>
</body>
</html>
