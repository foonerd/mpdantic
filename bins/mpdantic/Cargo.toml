[package]
name = "mpdantic"
description = "The core of MPDantic: audits and repairs a music library for MPD, and serves the management interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The API's JSON: the listings and the status out, the shell's settings in.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# fnmatch, the matcher MPD uses for .mpdignore, so a pattern matches here what it
# matches there.
libc = "0.2"
# The tags and the audio properties of every format MPD reads on Volumio, with the
# raw keys as written, so MPD's own rules can be applied to them here.
lofty = "0.25"

[lints]
workspace = true
