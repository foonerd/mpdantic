name: release

# A tag builds the release: the check and the cross builds in Glass's builder image, the
# plugin zip, then one job that signs it (MANIFEST inside, SHA256SUMS beside) and
# publishes it as a pre-release with the notes from the changelog. Run by hand it builds
# everything and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lints, tests, docs, plugin
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version the workspace carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, the workspace is $version" >&2; exit 1; }
          grep -q "\"version\": \"$version\"" plugin/package.json || { echo "plugin/package.json does not carry $version" >&2; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false
          save-if: false
      - run: scripts/check.sh

  shell:
    name: shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning -s sh plugin/install.sh plugin/uninstall.sh
      - run: shellcheck -S warning scripts/*.sh

  ship:
    name: cross builds, the plugin zip
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ship
          cache-bin: false
          save-if: false
      - run: scripts/ship.sh
      - run: scripts/package.sh
      - name: The zip names the commit it was built from
        run: |
          unzip -p dist/mpdantic-*.zip build.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
      - name: The zip carries the core for every architecture, and the modules
        run: |
          for arch in arm armv7 armv8 x64; do
            unzip -l dist/mpdantic-*.zip | grep -q " bin/$arch/mpdantic\$" || { echo "no bin/$arch/mpdantic in the zip" >&2; exit 1; }
          done
          for module in kew v-conf; do
            unzip -l dist/mpdantic-*.zip | grep -q " node_modules/$module/package.json\$" || { echo "no module $module in the zip" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-plugin
          path: dist/mpdantic-*.zip
          if-no-files-found: error

  publish:
    name: sign, publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, shell, ship]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-plugin
          path: dist
      # The zip carries MANIFEST, every file's digest, and its Ed25519 signature; beside
      # it SHA256SUMS and its signature. The private key comes from the repository's
      # secret RELEASE_SIGNING_KEY (PEM); the public key the plugin carries
      # (keys/release-signing.pub) checks every signature before anything is published.
      # A release is never published unsigned.
      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY in this repository: a release is never published unsigned" >&2
            exit 1
          fi
          scripts/sign-release.sh dist keys/release-signing.pub
      - name: Notes from the changelog, with the sponsorship footer
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            scripts/release-notes.sh "$version"
            printf '\n'
            cat .github/release-footer.md
          } > dist/notes.md
      # Published as a pre-release: no player is offered it but one asked for it by
      # version. It is made the latest by hand once it has been tried
      # (gh release edit <tag> --prerelease=false --latest).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --prerelease \
            dist/mpdantic-*.zip dist/SHA256SUMS dist/SHA256SUMS.sig
